<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Пожелания пользователей</title>
    <link href="/css/wishesPage.css" rel="stylesheet">
</head>

<header>
    <p>Event scope</p>

    <div class="header-links">

        <a href="/wish/create" th:if="${isAuth}">
            Добавить пожелание
        </a>

        <a href="/event">К мероприятиям</a>

        <a href="/userProfile" th:if="${isAuth}" th:text="${username}">
            Личный кабинет
        </a>

        <a href="/login" th:if="${!isAuth}">
            Вход
        </a>
    </div>
</header>

<body>

<div class="filters">

    <form action="/wish" method="get">

        <!-- ===== Только мои ===== -->
        <div class="filter-block" th:if="${isAuth}">
            <label class="only-mine-item">
                <input name="onlyMine"
                       th:checked="${onlyMine}"
                       type="checkbox"
                       value="true">
                <span>Только мои пожелания</span>
            </label>
        </div>

        <!-- ===== Дата ===== -->
        <div class="filter-block">

            <label class="filter-label">Дата создания</label>

            <input class="date-input"
                   name="createdDate"
                   th:value="${selectedDate}"
                   type="date">

        </div>

        <!-- ===== Теги ===== -->
        <div class="filter-block">

            <p class="filter-label">Теги</p>

            <div class="tags-filter">

                <label class="tag-filter-item"
                       th:each="tag : ${tags}">

                    <input name="tagIds"
                           th:checked="${selectedTags != null && selectedTags.contains(tag.id)}"
                           th:value="${tag.id}"
                           type="checkbox">

                    <span th:text="${tag.name}"></span>

                </label>

            </div>

        </div>

        <!-- ===== Кнопка ===== -->
        <button type="submit">
            Применить
        </button>

    </form>
</div>

<div class="wishes-column">

    <div id="wishItems">

        <div class="wishItem" th:each="wish : ${wishes}">

            <p class="wishTitle" th:text="${wish.title}"></p>

            <p class="wishDescription" th:text="${wish.description}"></p>

            <div class="wish-meta">
                <span class="wish-author" th:text="${wish.user.username}"></span>
                <span class="wish-dot">·</span>
                <span class="wish-date" th:text="${daysAgoMap[wish.id]}"></span>
            </div>

            <div class="wish-events-strip"
                 th:if="${wish.events != null && !wish.events.isEmpty()}">
                <span class="wish-events-label">События</span>
                <div class="wish-events-scroll">
                    <a class="wish-event-chip"
                       th:classappend="${event.status.name() == 'FINISHED'} ? ' chip-finished' : (${event.status.name() == 'CANCELED'} ? ' chip-canceled' : '')"
                       th:each="event : ${wish.events}"
                       th:href="@{/event/{id}(id=${event.id})}"
                       th:text="${event.title}">
                    </a>
                </div>
            </div>

            <div class="wish-footer">

                <div class="wishTags">
                <span class="tag"
                      th:each="tag : ${wish.tags}"
                      th:text="${tag.name}">
                </span>
                </div>

                <div class="wish-actions">

                    <a class="create-from-wish-btn"
                       th:href="@{/event/create(wishId=${wish.id})}"
                       th:if="${isOrganizer}">
                        + Создать мероприятие
                    </a>

                    <button class="like-btn"
                            th:attr="data-wish-id=${wish.id}"
                            th:classappend="${likedWishIds.contains(wish.id)} ? ' liked'"
                            th:if="${isAuth}">
                        ♥ <span class="like-count" th:text="${likeCounts[wish.id] ?: 0}"></span>
                    </button>

                    <span class="like-btn like-btn-readonly"
                          th:if="${!isAuth}">
                    ♥ <span class="like-count" th:text="${likeCounts[wish.id] ?: 0}"></span>
                </span>

                </div>

            </div>

        </div>

    </div>

    <!-- ===== Пагинация ===== -->
    <div class="pagination" th:if="${totalPages > 1}">

        <button class="pagination-btn"
                th:disabled="${currentPage == 0}"
                th:onclick="|goToPage(${currentPage - 1})|">
            &#8592;
        </button>

        <th:block th:each="p : ${pageNumbers}">
            <span class="pagination-ellipsis" th:if="${p == -1}">…</span>
            <button class="pagination-btn"
                    th:classappend="${p == currentPage} ? ' pagination-btn-active'"
                    th:if="${p != -1}"
                    th:onclick="|goToPage(${p})|"
                    th:text="${p + 1}">
            </button>
        </th:block>

        <button class="pagination-btn"
                th:disabled="${currentPage == totalPages - 1}"
                th:onclick="|goToPage(${currentPage + 1})|">
            &#8594;
        </button>

    </div>

</div><!-- /wishes-column -->

</body>

<script>
    function goToPage(pageNum) {
        const params = new URLSearchParams(window.location.search);
        params.set("page", pageNum);
        window.location.href = "/wish?" + params.toString();
    }

    document.querySelectorAll(".like-btn[data-wish-id]").forEach(btn => {
        btn.addEventListener("click", async () => {
            const wishId = btn.dataset.wishId;
            const res = await fetch(`/wish/like?wishId=${wishId}`, {method: "POST"});
            if (!res.ok) return;
            const data = await res.json();
            btn.querySelector(".like-count").textContent = data.count;
            btn.classList.toggle("liked", data.liked);
        });
    });
</script>

</html>
