<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EventScope</title>
    <link rel="stylesheet" href="/css/eventsPage.css">
</head>

<header>
    <p>Event scope</p>

    <div class="rightHrevs">
        <a th:if="${!isAuth}" href="/login">Вход</a>
        <a href="/wish">К пожеланиям</a>
        <a th:if="${isAuth}" href="/userProfile">Личный кабинет</a>
    </div>
</header>

<body>

<div class="page-layout">

    <!-- ===== События ===== -->
    <div id="items">

        <div id="item" th:each="event : ${events}">

            <p id="title"
               th:text="${event.title}">
            </p>

            <p id="description"
               th:text="${event.description}">
            </p>

            <div id="dates">

                <div id="created">
                    <p>Создан:</p>

                    <p th:text="${#temporals.format(event.createdAt, 'dd.MM.yyyy HH:mm')}">
                    </p>
                </div>

                <div id="eventDate">
                    <p>Запланирован на:</p>

                    <p th:text="${#temporals.format(event.eventDate, 'dd.MM.yyyy HH:mm')}">
                    </p>
                </div>

            </div>

            <div id="organizerInfo">

                <p>Организатор:</p>

                <p th:text="${event.organizer.name}">
                </p>

            </div>

            <!-- ===== Теги ===== -->
            <div class="event-tags">

                <span class="event-tag"
                      th:each="tag : ${event.tags}"
                      th:text="${tag.name}">
                </span>

            </div>

            <!-- ===== Кнопка участия ===== -->
            <div th:if="${isAuth}"
                 class="participation-container">

                <button
                        class="participation-btn"
                        th:attr="data-event-id=${event.id}"
                        th:text="${userEventIds.contains(event.id) ? 'Отменить участие' : 'Я пойду'}">
                </button>

                <span class="going-label"
                      th:style="${userEventIds.contains(event.id)} ? 'display:inline-flex' : 'display:none'">
                    ✔ Иду
                </span>

            </div>

        </div>

    </div>

    <!-- ===== Фильтры ===== -->
    <aside class="filters">

        <form method="get" action="/event">

            <!-- ===== Поиск ===== -->
            <div class="search-block">

                <input type="text"
                       name="title"
                       placeholder="Поиск..."
                       th:value="${title}">

                <button type="submit">
                    Поиск
                </button>

            </div>

            <!-- ===== Фильтры ===== -->
            <div class="filter-checkboxes">

                <label class="checkbox-item">

                    <input type="checkbox"
                           name="onlyFuture"
                           value="true"
                           th:checked="${onlyFuture}">

                    <span>Только будущие</span>

                </label>

                <label class="checkbox-item" th:if="${isAuth}">

                    <input type="checkbox"
                           name="onlyMyParticipantEvents"
                           value="true"
                           th:checked="${onlyMyParticipantEvents}">

                    <span>Только моё участие</span>

                </label>

            </div>

            <!-- ===== Теги ===== -->
            <div class="tags-filter">

                <label class="tag-filter-item"
                       th:each="tag : ${tags}">

                    <input type="checkbox"
                           name="tagIds"
                           th:value="${tag.id}"
                           th:checked="${selectedTags != null && selectedTags.contains(tag.id)}">

                    <span th:text="${tag.name}">
                    </span>

                </label>

            </div>

        </form>

    </aside>

</div>

</body>
</html>

<script>
    document.addEventListener("DOMContentLoaded", () => {

        document.querySelectorAll(".participation-btn")
            .forEach(button => {

                const label = button.nextElementSibling;

                button.style.backgroundColor =
                    button.textContent.includes("Отменить")
                        ? "#ef4444"
                        : "#3b82f6";

                button.addEventListener("click", async () => {

                    const eventId = button.dataset.eventId;

                    const action =
                        button.textContent.includes("Я пойду")
                            ? "join"
                            : "leave";

                    const response = await fetch(
                        `/${action}?eventId=${eventId}`,
                        {
                            method: "POST"
                        }
                    );

                    if (response.ok) {

                        if (action === "join") {

                            button.textContent =
                                "Отменить участие";

                            button.style.backgroundColor =
                                "#ef4444";

                            label.style.display =
                                "inline-flex";

                        } else {

                            button.textContent =
                                "Я пойду";

                            button.style.backgroundColor =
                                "#3b82f6";

                            label.style.display =
                                "none";
                        }
                    }
                });
            });
    });
</script>
