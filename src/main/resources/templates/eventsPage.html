<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>EventScope</title>
    <link href="/css/eventsPage.css" rel="stylesheet">
</head>

<header>
    <p>Event scope</p>

    <div class="header-links">
        <a href="/login" th:if="${!isAuth}">Вход</a>
        <a href="/wish">К пожеланиям</a>
        <a href="/userProfile" th:if="${isAuth}" th:text="${username}">Личный кабинет</a>
    </div>
</header>

<body>

<div class="page-layout">


    <div class="events-column">


        <div id="items">

            <div id="item"
                 th:attr="data-href=@{/event/{id}(id=${event.id})}"
                 th:classappend="${event.status.name() == 'IN_PROGRESS'} ? 'item-in-progress'"
                 th:each="event : ${events}">

                <div class="card-header-row">

                    <p id="title"
                       th:text="${event.title}">
                    </p>

                    <span class="card-status-badge"
                          th:classappend="${event.status.name() == 'PLANNED'}     ? 'badge-planned' :
                                      (${event.status.name() == 'IN_PROGRESS'} ? 'badge-in-progress' : '')"
                          th:text="${event.status.displayName}">
                </span>

                </div>

                <p id="description"
                   th:text="${event.description}">
                </p>


                <div class="event-meta">

                    <span class="event-organizer-label">Организатор:</span>
                    <span class="event-organizer-name" th:text="${event.organizer.name}"></span>

                    <span class="meta-dot">·</span>

                    <span class="event-organizer-label">Начало в:</span>

                    <span class="event-meta-date"
                          th:text="${#temporals.format(event.eventDate, 'dd.MM.yyyy')}">
                </span>

                    <span class="event-time-badge"
                          th:text="${#temporals.format(event.eventDate, 'HH:mm')}">
                </span>

                    <span class="meta-dot">·</span>

                    <span class="event-organizer-label">до</span>

                    <span class="event-meta-date"
                          th:text="${#temporals.format(event.eventEndDate, 'dd.MM.yyyy')}">
                </span>

                    <span class="event-time-badge"
                          th:text="${#temporals.format(event.eventEndDate, 'HH:mm')}">
                </span>

                </div>


                <div class="event-address">
                    <span class="event-address-icon">📍</span>
                    <span class="event-address-text"
                          th:if="${event.address != null && !#strings.isEmpty(event.address)}"
                          th:text="${event.address}">
                </span>
                    <span class="event-address-empty"
                          th:if="${event.address == null || #strings.isEmpty(event.address)}">
                    Адрес не указан
                </span>
                </div>


                <div class="event-footer">

                    <div class="event-tags">
                    <span class="event-tag"
                          th:each="tag : ${event.tags}"
                          th:text="${tag.name}">
                    </span>
                    </div>

                    <div class="event-actions">

                        <div class="participation-container" th:if="${isAuth}">
                            <button class="participation-btn"
                                    th:attr="data-event-id=${event.id}"
                                    th:text="${userEventIds.contains(event.id) ? 'Отменить участие' : 'Я пойду'}">
                            </button>
                            <span class="going-label"
                                  th:style="${userEventIds.contains(event.id)} ? 'display:inline-flex' : 'display:none'">
                            ✔ Иду
                        </span>
                        </div>

                        <a class="detail-link"
                           th:href="@{/event/{id}(id=${event.id})}">
                            Подробнее
                        </a>

                    </div>

                </div>

            </div>

        </div>


        <div class="pagination" th:if="${totalPages > 1}">

            <button class="pagination-btn"
                    th:disabled="${currentPage == 0}"
                    th:onclick="|goToPage(${currentPage - 1})|">
                &#8592;
            </button>

            <th:block th:each="p : ${pageNumbers}">
                <span class="pagination-ellipsis" th:if="${p == -1}">…</span>
                <button class="pagination-btn"
                        th:classappend="${p == currentPage} ? ' pagination-btn-active'"
                        th:if="${p != -1}"
                        th:onclick="|goToPage(${p})|"
                        th:text="${p + 1}">
                </button>
            </th:block>

            <button class="pagination-btn"
                    th:disabled="${currentPage == totalPages - 1}"
                    th:onclick="|goToPage(${currentPage + 1})|">
                &#8594;
            </button>

        </div>

    </div>


    <aside class="filters">

        <form action="/event" method="get">


            <button class="apply-btn" type="submit">
                Применить
            </button>


            <div class="search-block">

                <input name="title"
                       placeholder="Поиск по названию..."
                       th:value="${title}"
                       type="text">

            </div>


            <div class="search-block">

                <input name="organizer"
                       placeholder="Организатор..."
                       th:value="${organizer}"
                       type="text">

            </div>


            <div class="search-block">

                <input name="address"
                       placeholder="Адрес..."
                       th:value="${address}"
                       type="text">

            </div>


            <div class="filter-section">

                <p class="filter-label">Дата проведения</p>

                <input class="date-input"
                       name="eventDate"
                       th:value="${eventDate != null ? #temporals.format(eventDate, 'yyyy-MM-dd') : ''}"
                       type="date">

            </div>


            <div class="filter-section">

                <p class="filter-label">Сортировка</p>

                <select class="sort-select"
                        name="sortBy">

                    <option th:selected="${selectedSortBy == 'DATE_ASC'}"
                            value="DATE_ASC">
                        Сначала ближайшие
                    </option>

                    <option th:selected="${selectedSortBy == 'DATE_DESC'}"
                            value="DATE_DESC">
                        Сначала дальние
                    </option>

                </select>

            </div>


            <label class="in-progress-toggle"
                   th:classappend="${inProgress} ? 'in-progress-toggle-active'">
                <input name="inProgress"
                       th:checked="${inProgress}"
                       type="checkbox"
                       value="true">
                <span class="in-progress-dot"></span>
                Идут сейчас
            </label>


            <div class="tags-filter">

                <label class="tag-filter-item"
                       th:each="tag : ${tags}">

                    <input name="tagIds"
                           th:checked="${selectedTags != null && selectedTags.contains(tag.id)}"
                           th:value="${tag.id}"
                           type="checkbox">

                    <span th:text="${tag.name}">
                    </span>

                </label>

            </div>

        </form>

    </aside>

</div>

</body>
</html>

<script>
    function goToPage(pageNum) {
        const params = new URLSearchParams(window.location.search);
        params.set("page", pageNum);
        window.location.href = "/event?" + params.toString();
    }

    document.addEventListener("DOMContentLoaded", () => {

        // ===== Навигация по карточке =====
        document.querySelectorAll("#item").forEach(card => {
            card.style.cursor = "pointer";
            card.addEventListener("click", () => {
                window.location.href = card.dataset.href;
            });
        });

        // ===== Кнопка участия (остановить всплытие) =====
        document.querySelectorAll(".participation-btn")
            .forEach(button => {

                const label = button.nextElementSibling;

                button.style.backgroundColor =
                    button.textContent.includes("Отменить")
                        ? "#ef4444"
                        : "#3b82f6";

                button.addEventListener("click", async (e) => {

                    e.stopPropagation();

                    const eventId = button.dataset.eventId;

                    const action =
                        button.textContent.includes("Я пойду")
                            ? "join"
                            : "leave";

                    const response = await fetch(
                        `/${action}?eventId=${eventId}`,
                        {
                            method: "POST"
                        }
                    );

                    if (response.ok) {

                        if (action === "join") {

                            button.textContent =
                                "Отменить участие";

                            button.style.backgroundColor =
                                "#ef4444";

                            label.style.display =
                                "inline-flex";

                        } else {

                            button.textContent =
                                "Я пойду";

                            button.style.backgroundColor =
                                "#3b82f6";

                            label.style.display =
                                "none";
                        }
                    }
                });
            });

        document.querySelectorAll(".detail-link").forEach(link => {
            link.addEventListener("click", e => e.stopPropagation());
        });

        const inProgressCb = document.querySelector(".in-progress-toggle input[type='checkbox']");
        if (inProgressCb) {
            inProgressCb.addEventListener("change", () => {
                inProgressCb.closest(".in-progress-toggle")
                    .classList.toggle("in-progress-toggle-active", inProgressCb.checked);
            });
        }
    });
</script>
