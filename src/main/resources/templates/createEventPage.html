<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Создание мероприятия</title>

    <link rel="stylesheet"
          href="/css/createEventPage.css">

    <script th:src="|https://api-maps.yandex.ru/2.1/?apikey=${yandexMapsApiKey}&lang=ru_RU|"
            type="text/javascript"></script>
</head>

<header>

    <p>Event scope</p>

    <div class="header-links">

        <a href="/userProfile">
            Личный кабинет
        </a>

        <a href="/event">
            К мероприятиям
        </a>

        <a href="/wish">
            К пожеланиям
        </a>

    </div>

</header>

<body>

<div class="create-container">

    <form th:action="@{/event/create}"
          method="post"
          th:object="${event}">

        <h1>
            Создание мероприятия
        </h1>

        <!-- ===== Пожелание-источник ===== -->
        <div th:if="${sourceWish}"
             class="source-wish-banner"
             id="sourceWishBanner">

            <input type="hidden" name="wishId" th:value="${wishId}">

            <div class="source-wish-header">
                <div>
                    <p class="source-wish-label">На основе пожелания</p>
                    <p class="source-wish-title" th:text="${sourceWish.title}"></p>
                </div>
                <span class="source-wish-chevron">&#8249;</span>
            </div>

            <div class="source-wish-details" id="sourceWishDetails">

                <p class="source-wish-description"
                   th:text="${sourceWish.description}">
                </p>

                <div class="source-wish-meta">

                    <span class="source-wish-meta-item">
                        &#128100; <span th:text="${sourceWish.user.username}"></span>
                    </span>

                    <span class="source-wish-meta-item">
                        &#128336; <span th:text="${wishDaysAgo}"></span>
                    </span>

                    <span class="source-wish-meta-item">
                        &#9829; <span th:text="${wishLikeCount}"></span>
                    </span>

                </div>

                <div class="source-wish-tags"
                     th:if="${sourceWish.tags != null && !sourceWish.tags.isEmpty()}">
                    <span class="source-wish-tag"
                          th:each="tag : ${sourceWish.tags}"
                          th:text="${tag.name}">
                    </span>
                </div>

            </div>

        </div>

        <!-- ===== Название ===== -->
        <div class="input-block">

            <label>
                Название
            </label>

            <input type="text"
                   th:field="*{title}"
                   placeholder="Введите название мероприятия">

            <p class="validation-error"
               th:if="${#fields.hasErrors('title')}"
               th:errors="*{title}">
            </p>

        </div>

        <!-- ===== Описание ===== -->
        <div class="input-block">

            <label>
                Описание
            </label>

            <textarea th:field="*{description}"
                      placeholder="Расскажите подробнее о мероприятии"></textarea>

            <p class="validation-error"
               th:if="${#fields.hasErrors('description')}"
               th:errors="*{description}">
            </p>

        </div>

        <!-- ===== Дата мероприятия ===== -->
        <div class="input-block">

            <label>
                Дата и время начала
            </label>

            <input type="datetime-local"
                   id="eventDateInput"
                   th:field="*{eventDate}"
                   th:attr="min=${minDateTime}">

            <p class="validation-error"
               th:if="${#fields.hasErrors('eventDate')}"
               th:errors="*{eventDate}">
            </p>

        </div>

        <!-- ===== Дата окончания ===== -->
        <div class="input-block">

            <label>
                Дата и время окончания
            </label>

            <input type="datetime-local"
                   id="eventEndDateInput"
                   th:field="*{eventEndDate}"
                   th:attr="min=${minEndDateTime}">

            <p class="validation-error"
               th:if="${#fields.hasErrors('eventEndDate')}"
               th:errors="*{eventEndDate}">
            </p>

        </div>

        <!-- ===== Адрес ===== -->
        <div class="input-block">

            <label>Адрес (необязательно)</label>

            <div class="map-search-row">

                <input type="text"
                       id="addressInput"
                       name="address"
                       th:value="${event.address}"
                       placeholder="Введите адрес или выберите точку на карте"
                       autocomplete="off">

                <button type="button"
                        id="searchAddressBtn"
                        class="map-search-btn">
                    Найти
                </button>

            </div>

        </div>

        <!-- ===== Карта ===== -->
        <div class="input-block">
            <div id="yandex-map" class="map-container"></div>
        </div>

        <!-- ===== Теги ===== -->
        <div class="tags-section">

            <p class="tags-title">
                Теги
            </p>

            <div class="tags-container">

                <label class="tag-item"
                       th:each="tag : ${tags}">

                    <input type="checkbox"
                           name="tagIds"
                           th:value="${tag.id}">

                    <span th:text="${tag.name}">
                    </span>

                </label>

            </div>

        </div>

        <!-- ===== Кнопка ===== -->
        <button type="submit"
                class="submit-btn">

            Опубликовать

        </button>

    </form>

</div>

</body>

<script>
    const banner = document.getElementById("sourceWishBanner");
    if (banner) {
        const details = document.getElementById("sourceWishDetails");
        banner.addEventListener("click", (e) => {
            if (e.target.closest("input[type='hidden']")) return;
            const expanded = banner.classList.toggle("expanded");
            details.style.maxHeight = expanded ? details.scrollHeight + "px" : "0";
        });
    }

    // ===== Яндекс карта =====
    if (typeof ymaps !== "undefined") {
        ymaps.ready(function () {

            const addressInput = document.getElementById("addressInput");

            const map = new ymaps.Map("yandex-map", {
                center: [55.7558, 37.6173],
                zoom: 11,
                controls: ["zoomControl"]
            });

            let placemark = null;

            function setPlacemark(coords, address) {
                if (placemark) map.geoObjects.remove(placemark);
                placemark = new ymaps.Placemark(coords,
                    { balloonContent: address },
                    { preset: "islands#redDotIcon" }
                );
                map.geoObjects.add(placemark);
            }

            function searchByAddress() {
                const query = addressInput.value.trim();
                if (!query) return;
                ymaps.geocode(query, { results: 1 }).then(function (res) {
                    const obj = res.geoObjects.get(0);
                    if (!obj) return;
                    const coords = obj.geometry.getCoordinates();
                    addressInput.value = obj.getAddressLine();
                    map.setCenter(coords, 16);
                    setPlacemark(coords, addressInput.value);
                });
            }

            map.events.add("click", function (e) {
                const coords = e.get("coords");
                ymaps.geocode(coords, { results: 1 }).then(function (res) {
                    const obj = res.geoObjects.get(0);
                    if (!obj) return;
                    addressInput.value = obj.getAddressLine();
                    setPlacemark(coords, addressInput.value);
                });
            });

            document.getElementById("searchAddressBtn")
                .addEventListener("click", searchByAddress);

            addressInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") { e.preventDefault(); searchByAddress(); }
            });

            if (addressInput.value.trim()) searchByAddress();
        });
    }

    const startInput = document.getElementById("eventDateInput");
    const endInput   = document.getElementById("eventEndDateInput");

    function updateEndMin() {
        if (!startInput.value) return;
        const start = new Date(startInput.value);
        start.setHours(start.getHours() + 1);
        const minEnd = start.toISOString().slice(0, 16);
        endInput.min = minEnd;
        if (endInput.value && endInput.value < minEnd) {
            endInput.value = "";
        }
    }

    startInput.addEventListener("change", updateEndMin);
</script>

</html>
