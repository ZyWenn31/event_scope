<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="${event.title}">Мероприятие</title>

    <link rel="stylesheet"
          href="/css/eventDetailPage.css">
</head>

<header>

    <p>Event scope</p>

    <div class="header-links">

        <a href="/event">
            К мероприятиям
        </a>

        <a href="/wish">
            К пожеланиям
        </a>

        <a th:if="${isAuth}"
           href="/userProfile"
           th:text="${username}">
            Личный кабинет
        </a>

        <a th:if="${!isAuth}" href="/login">
            Войти
        </a>

    </div>

</header>

<body>

<button class="back-btn" onclick="history.back()">&#8592; Назад</button>

<div class="detail-layout">

    <!-- ===== ЛЕВАЯ ЧАСТЬ — основная информация ===== -->
    <div class="main-panel">

        <!-- ===== Шапка карточки ===== -->
        <div class="event-header">

            <h1 class="event-title"
                th:text="${event.title}">
            </h1>

            <div class="status-badge"
                 th:classappend="${event.status.name() == 'PLANNED'} ? 'status-planned' :
                                 (${event.status.name() == 'FINISHED'} ? 'status-finished' : 'status-canceled')">
                <span th:text="${event.status.displayName}"></span>
            </div>

        </div>

        <!-- ===== Организатор ===== -->
        <div class="info-block">

            <p class="info-label">Организатор</p>

            <div th:if="${isCurrentUserOrganizer}"
                 class="organizer-you">
                Вы организатор
            </div>

            <a th:if="${!isCurrentUserOrganizer}"
               class="organizer-link"
               th:href="@{/userProfile/{username}(username=${event.organizer.username})}"
               th:text="${event.organizer.name}">
            </a>

        </div>

        <!-- ===== Описание ===== -->
        <div class="info-block">

            <p class="info-label">Описание</p>

            <p class="event-description"
               th:text="${event.description}">
            </p>

        </div>

        <!-- ===== Даты ===== -->
        <div class="dates-row">

            <div class="date-block">

                <p class="info-label">Дата мероприятия</p>

                <p class="date-value"
                   th:text="${#temporals.format(event.eventDate, 'dd.MM.yyyy HH:mm')}">
                </p>

            </div>

            <div class="date-block">

                <p class="info-label">Создано</p>

                <p class="date-value"
                   th:text="${#temporals.format(event.createdAt, 'dd.MM.yyyy HH:mm')}">
                </p>

            </div>

        </div>

        <!-- ===== Рейтинг ===== -->
        <div class="info-block">

            <p class="info-label">Рейтинг</p>

            <div class="rating-row">

                <span class="rating-number"
                      th:text="${event.rating}">
                </span>

                <span class="rating-star">★</span>

            </div>

        </div>

        <!-- ===== Теги ===== -->
        <div class="info-block"
             th:if="${event.tags != null && !event.tags.isEmpty()}">

            <p class="info-label">Теги</p>

            <div class="tags-list">

                <span class="tag-chip"
                      th:each="tag : ${event.tags}"
                      th:text="${tag.name}">
                </span>

            </div>

        </div>

        <!-- ===== Форма отзыва ===== -->
        <div class="review-form-block"
             th:if="${canReview}">

            <p class="info-label">Оставить отзыв</p>

            <form th:action="@{/event/{id}/review(id=${event.id})}"
                  method="post"
                  class="review-form">

                <div class="star-rating">

                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5">★</label>

                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4">★</label>

                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3">★</label>

                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2">★</label>

                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1">★</label>

                </div>

                <textarea class="review-textarea"
                          name="comment"
                          placeholder="Ваш комментарий (необязательно)"
                          maxlength="1000"
                          rows="3">
                </textarea>

                <button type="submit"
                        class="review-submit-btn">
                    Отправить отзыв
                </button>

            </form>

        </div>

        <!-- ===== Уже оставлен отзыв ===== -->
        <div class="review-done-block"
             th:if="${alreadyReviewed}">

            <span class="review-done-icon">✓</span>

            <p>Вы уже оставили отзыв на это мероприятие</p>

        </div>

        <!-- ===== Отзывы на мероприятие ===== -->
        <div class="event-reviews-block"
             th:if="${event.status.name() == 'FINISHED'}">

            <p class="event-reviews-title">Отзывы</p>

            <div th:if="${event.reviews.isEmpty()}"
                 class="event-reviews-empty">
                Отзывов пока нет
            </div>

            <div class="event-reviews-list"
                 th:if="${!event.reviews.isEmpty()}">

                <div class="event-review-card"
                     th:each="review : ${event.reviews}">

                    <div class="event-review-header">

                        <p class="event-review-author"
                           th:text="${review.user.username}">
                        </p>

                        <span class="event-review-stars"
                              th:text="${review.rating + ' ★'}">
                        </span>

                    </div>

                    <p class="event-review-comment"
                       th:if="${review.comment != null && !review.comment.isBlank()}"
                       th:text="${review.comment}">
                    </p>

                    <p class="event-review-date"
                       th:if="${review.createdAt != null}"
                       th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy')}">
                    </p>

                </div>

            </div>

        </div>

    </div>

    <!-- ===== ПРАВАЯ ЧАСТЬ — участники ===== -->
    <div class="participants-panel">

        <div class="participants-header">

            <p class="participants-title">Участники</p>

            <span class="participants-count"
                  th:text="${participantCount}">
            </span>

        </div>

        <div class="participants-scroll">

            <div th:if="${participants.isEmpty()}"
                 class="no-participants">
                Пока никто не записался
            </div>

            <div class="participant-card"
                 th:each="p : ${participants}"
                 th:attr="data-href=@{/userProfile/{username}(username=${p.user.username})}">

                <img class="participant-avatar"
                     th:src="${p.user.avatarPath}"
                     th:onerror="this.src='/css/default-avatar.png'"
                     alt="avatar">

                <div class="participant-info">

                    <p class="participant-username"
                       th:text="${p.user.username}">
                    </p>

                    <p class="participant-name"
                       th:if="${p.user.name != null && !p.user.name.isBlank()}"
                       th:text="${p.user.name}">
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

<script>
    document.querySelectorAll(".participant-card").forEach(card => {
        card.style.cursor = "pointer";
        card.addEventListener("click", () => {
            window.location.href = card.dataset.href;
        });
    });
</script>

</html>
