<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход — EventScope</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<div class="auth-wrapper">

    <!-- ===== Брендовая панель ===== -->
    <div class="auth-brand">
        <div class="brand-circles">
            <div class="circle c1"></div>
            <div class="circle c2"></div>
            <div class="circle c3"></div>
        </div>
        <div class="brand-content">
            <p class="brand-logo">Event scope</p>
            <p class="brand-tagline">Находите события,<br>которые вам интересны</p>
        </div>
    </div>

    <!-- ===== Форма ===== -->
    <div class="auth-form-side">
        <div class="auth-card">

            <h2>Вход в аккаунт</h2>

            <div th:if="${errorMessage}" class="error-msg">
                <p th:text="${errorMessage}"></p>
            </div>

            <form th:action="@{/login}" method="post">

                <div class="input-block">
                    <label>Логин</label>
                    <input type="text" name="username" required placeholder="Введите логин">
                </div>

                <div class="input-block">
                    <label>Пароль</label>
                    <input type="password" name="password" required placeholder="Введите пароль">
                </div>

                <button type="submit" class="submit-btn">Войти</button>

            </form>

            <div class="auth-links">
                <a href="/registration">Нет аккаунта? Зарегистрируйтесь</a>
                <a href="/event">Смотреть события без входа</a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
