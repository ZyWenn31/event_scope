<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Регистрация — EventScope</title>
    <link href="/css/registration.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">

    <!-- ===== Брендовая панель ===== -->
    <div class="auth-brand">
        <div class="brand-circles">
            <div class="circle c1"></div>
            <div class="circle c2"></div>
            <div class="circle c3"></div>
        </div>
        <div class="brand-content">
            <p class="brand-logo">Event scope</p>
            <p class="brand-tagline">Присоединяйтесь и<br>создавайте мероприятия вместе</p>
        </div>
    </div>

    <!-- ===== Форма ===== -->
    <div class="auth-form-side">
        <div class="auth-card">

            <h2>Создать аккаунт</h2>

            <form action="/registration" method="post" th:object="${user}">

                <div class="input-block">
                    <label>Логин</label>
                    <input name="username" placeholder="Придумайте логин" required
                           th:field="*{username}"
                           type="text">
                    <p class="validation-error"
                       th:errors="*{username}"
                       th:if="${#fields.hasErrors('username')}">
                    </p>
                </div>

                <div class="input-block">
                    <label>Пароль</label>
                    <div class="input-wrapper">
                        <input id="password" name="password" placeholder="Придумайте пароль" required
                               th:field="*{password}"
                               type="password">
                        <button aria-label="Показать пароль" class="toggle-password"
                                onclick="togglePassword('password', this)"
                                type="button">
                            <svg fill="none" stroke="currentColor" stroke-width="2"
                                 viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round"
                                      stroke-linejoin="round"/>
                                <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                                      stroke-linecap="round"
                                      stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                    <p class="validation-error"
                       th:errors="*{password}"
                       th:if="${#fields.hasErrors('password')}">
                    </p>
                </div>

                <button class="submit-btn" type="submit">Зарегистрироваться</button>

            </form>

            <div class="auth-links">
                <a href="/login">Уже есть аккаунт? Войдите</a>
                <a href="/event">Смотреть события без входа</a>
            </div>

        </div>
    </div>

</div>

<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.setAttribute('aria-label', isHidden ? 'Скрыть пароль' : 'Показать пароль');
        btn.querySelector('svg').innerHTML = isHidden
            ? '<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.477 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>'
            : '<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
    }
</script>
</body>
</html>
